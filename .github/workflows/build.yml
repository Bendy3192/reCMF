name: build

on:
  push:
    branches: ["**"]
    # Documentation changes cannot break the build, and every push costs three jobs.
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "NOTICE"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    # The protocol module is plain Kotlin/JVM, so it builds and tests without an
    # Android SDK. Keeping it a separate job means protocol regressions are obvious
    # even when the Android build is broken for unrelated reasons.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test protocol
        # Blanked so :app is left out of the build even though the runner image ships
        # an Android SDK — this job is meant to prove the JVM module stands alone.
        env:
          ANDROID_HOME: ""
          ANDROID_SDK_ROOT: ""
        run: ./gradlew :protocol:test --no-daemon

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-test-report
          path: protocol/build/reports/tests/test

  versions:
    # Google's Maven repository is not reachable from every development environment, so
    # this lists what is actually published for each dependency the catalog pins. It is
    # its own job, with no Gradle setup, so the answer is the whole log rather than a
    # few lines buried in a build.
    #
    # Diagnostic, not a gate: it runs only when asked for, so an ordinary push costs two
    # jobs rather than three.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Published versions
        run: |
          for artifact in \
            androidx/health/connect/connect-client \
            androidx/compose/compose-bom \
            androidx/compose/material3/material3 \
            androidx/activity/activity-compose \
            androidx/lifecycle/lifecycle-service \
            androidx/core/core-ktx \
            androidx/room/room-runtime \
            androidx/work/work-runtime-ktx \
            androidx/datastore/datastore-preferences \
            androidx/compose/ui/ui \
            com/android/tools/build/gradle
          do
            versions=$(curl -s "https://dl.google.com/dl/android/maven2/$artifact/maven-metadata.xml" \
              | grep -o "<version>[^<]*</version>" | sed "s/<[^>]*>//g")
            stable=$(echo "$versions" | grep -v -- "-alpha\|-beta\|-rc\|-dev" | tail -10 | tr "\n" " ")
            echo "$artifact -> stable: ${stable:-none} | newest: $(echo "$versions" | tail -2 | tr "\n" " ")"
          done

      # Compose 1.12, material3 1.5 and Material 3 Expressive all need compileSdk 37.
      # This says when that becomes possible.
      - name: Can the Android 17 platform be installed yet
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses > /dev/null 2>&1 || true
          for channel in 0 1 2 3; do
            if "$sdk" --channel=$channel "platforms;android-37" > /dev/null 2>&1; then
              echo "android-37 installs from channel $channel"
              exit 0
            fi
          done
          echo "android-37 is not installable from any channel"

  app:
    runs-on: ubuntu-latest
    # Only to publish the release below; everything else here reads.
    permissions:
      contents: write
    # Lifted to the job so the signing step can test whether it was configured: the
    # `secrets` context is not available to a step's `if`, but `env` is.
    env:
      RECMF_KEYSTORE_BASE64: ${{ secrets.RECMF_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the compile SDK
        # Only the platform. The build tools are deliberately not pinned here — there is
        # no build-tools release numbered to match every platform, and AGP fetches the
        # revision it wants once the licences are accepted.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Saving the cache prints several hundred lines after the build, which pushes
          # the failure extract out of reach. Reads still come from the protocol job's
          # entries.
          cache-read-only: true

      # Optional. Without it the build falls back to the key checked into the
      # repository, which is public and therefore signs an APK anyone could also sign.
      - name: Use the private signing key, if one is configured
        if: env.RECMF_KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RECMF_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RECMF_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RECMF_KEY_PASSWORD }}
        run: |
          echo "$RECMF_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/recmf.keystore"
          {
            echo "RECMF_KEYSTORE=$RUNNER_TEMP/recmf.keystore"
            echo "RECMF_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "RECMF_KEY_ALIAS=$KEY_ALIAS"
            echo "RECMF_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Assemble debug
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon 2>&1 | tee /tmp/assemble.log

      - name: Unit tests
        # A JUnit 5 platform that is not wired up runs zero tests and reports success,
        # which would make this whole job meaningless. Count what actually ran.
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon 2>&1 | tee /tmp/test.log
          ran=$(grep -ho 'tests="[0-9]*"' app/build/test-results/testDebugUnitTest/*.xml \
            | grep -o "[0-9]*" | paste -sd+ | bc)
          echo "app unit tests executed: ${ran:-0}"
          test "${ran:-0}" -gt 0

      - name: Lint
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug --no-daemon 2>&1 | tee /tmp/lint.log

      # Gradle's own output is followed by a few hundred lines of cache and cleanup
      # chatter, which buries the actual error. This re-prints just the compiler errors
      # and the failure block, last, where they are easy to find.
      - name: Why it failed
        if: failure()
        run: |
          for log in /tmp/assemble.log /tmp/test.log /tmp/lint.log; do
            [ -f "$log" ] || continue
            echo "===== $log"
            sed -n "/^\* What went wrong:/,/^\* Try:/p" "$log" | head -70
            # Warnings too, not just errors: the build runs with -Werror, so the line
            # that actually names the cause is a "w:" and only the useless "warnings
            # found and -Werror specified" is an "e:".
            grep -E "^(e|w): " "$log" | head -30 || true
          done
          # Both test tasks point at an HTML report rather than naming what failed.
          find . -path "*/test-results/*" -name "*.xml" \
            -exec grep -hB1 "<failure" {} \; 2>/dev/null | head -40 || true
          # Lint points at a report file rather than listing what it found.
          find app/build -name "lint-results-*.txt" \
            -exec grep -hE "^/.*(Error|Warning):" {} \; 2>/dev/null | head -40 || true

      - uses: actions/upload-artifact@v4
        with:
          name: recmf-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # What the app checks for updates against. Artifacts would not do: reading one
      # needs a token, and they expire — a release is public, permanent, and has a stable
      # "latest" the app can ask for without credentials.
      #
      # Only from the development branch, and only when everything above passed: a release
      # is what phones will install, so a red build must never become one.
      - name: Publish the build as a release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Copied rather than passed with gh's "#label" syntax, which sets a display
          # label and leaves the asset named app-debug.apk.
          cp "$(ls app/build/outputs/apk/debug/*.apk | head -1)" recmf.apk
          # The version code is the run number, so the tag is the version and the app can
          # compare without downloading anything.
          gh release create "build-${{ github.run_number }}" recmf.apk \
            --title "build ${{ github.run_number }}" \
            --notes "Automatic build of ${{ github.sha }}." \
            --latest
