name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    # The protocol module is plain Kotlin/JVM, so it builds and tests without an
    # Android SDK. Keeping it a separate job means protocol regressions are obvious
    # even when the Android build is broken for unrelated reasons.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test protocol
        # Blanked so :app is left out of the build even though the runner image ships
        # an Android SDK — this job is meant to prove the JVM module stands alone.
        env:
          ANDROID_HOME: ""
          ANDROID_SDK_ROOT: ""
        run: ./gradlew :protocol:test --no-daemon

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-test-report
          path: protocol/build/reports/tests/test

  versions:
    # Google's Maven repository is not reachable from every development environment, so
    # this lists what is actually published for each dependency the catalog pins. It is
    # its own job, with no Gradle setup, so the answer is the whole log rather than a
    # few lines buried in a build.
    runs-on: ubuntu-latest
    steps:
      - name: Published versions
        run: |
          for artifact in \
            androidx/health/connect/connect-client \
            androidx/compose/compose-bom \
            androidx/compose/material3/material3 \
            androidx/activity/activity-compose \
            androidx/lifecycle/lifecycle-service \
            androidx/core/core-ktx \
            androidx/room/room-runtime \
            androidx/work/work-runtime-ktx \
            androidx/datastore/datastore-preferences \
            com/android/tools/build/gradle
          do
            versions=$(curl -s "https://dl.google.com/dl/android/maven2/$artifact/maven-metadata.xml" \
              | grep -o "<version>[^<]*</version>" | sed "s/<[^>]*>//g")
            stable=$(echo "$versions" | grep -v -- "-alpha\|-beta\|-rc\|-dev" | tail -3 | tr "\n" " ")
            echo "$artifact -> stable: ${stable:-none} | newest: $(echo "$versions" | tail -2 | tr "\n" " ")"
          done

      - name: Available SDK platforms
        run: |
          listing=$("$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list 2>/dev/null)
          for prefix in "platforms;android-" "build-tools;"; do
            echo "$listing" | grep -oE "$prefix[0-9A-Za-z.-]+" | sort -uV | tail -8 | tr "\n" " "
            echo
          done

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the compile SDK
        # Only the platform. The build tools are deliberately not pinned here — there is
        # no build-tools release numbered to match every platform, and AGP fetches the
        # revision it wants once the licences are accepted.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: recmf-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
