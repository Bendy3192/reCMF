name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    # The protocol module is plain Kotlin/JVM, so it builds and tests without an
    # Android SDK. Keeping it a separate job means protocol regressions are obvious
    # even when the Android build is broken for unrelated reasons.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test protocol
        run: ./gradlew :protocol:test --no-daemon

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-test-report
          path: protocol/build/reports/tests/test

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the compile SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: recmf-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
